<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>海纳 · 智慧零售管理平台演示</title>
  <style>
    :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #20344a; background: #f4f7fb; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; } a { color: inherit; text-decoration: none; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 24px clamp(24px, 6vw, 90px); background: #fff; border-bottom: 1px solid #e7edf4; }
    .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: #fff; background: #2268c5; font-size: 24px; font-weight: 700; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .08em; } .brand small { color: #8293a6; font-size: 11px; }
    main { width: min(1100px, calc(100% - 48px)); margin: auto; padding: 65px 0 80px; }
    .eyebrow { color: #2674c6; font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 15px 0 14px; font-size: clamp(30px, 4vw, 48px); line-height: 1.25; }
    .intro { max-width: 620px; margin: 0; color: #74869b; font-size: 15px; line-height: 1.8; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 40px; }
    .card { display: flex; flex-direction: column; min-height: 225px; padding: 28px; border: 1px solid #e5ebf2; border-radius: 16px; background: #fff; box-shadow: 0 10px 28px rgba(22, 54, 88, .035); }
    .card.live { border-color: #bcd5f1; } .code { color: #2a79c7; font: 700 12px ui-monospace, monospace; letter-spacing: .12em; }
    .card h2 { margin: 24px 0 8px; font-size: 20px; } .card p { margin: 0; color: #8292a5; font-size: 13px; line-height: 1.7; }
    .action { margin-top: auto; padding-top: 23px; color: #2268c5; font-size: 13px; font-weight: 700; }
    .planned .action { color: #a0adbb; } .card.live:hover { transform: translateY(-2px); box-shadow: 0 16px 35px rgba(22, 54, 88, .08); }
    footer { padding: 24px; color: #9aa9b9; font-size: 11px; text-align: center; }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; }.card { min-height: 185px; } main { padding: 45px 0; } }
  </style>
</head>
<body><div class="shell">
  <header><span class="mark">海</span><span class="brand"><strong>海纳</strong><small>智慧零售管理平台 · 前端演示</small></span></header>
  <main>
    <div class="eyebrow">HAINA · PRODUCT DEMOS</div>
    <h1>选择一个子系统，开始体验。</h1>
    <p class="intro">各子系统使用独立的访问路径。当前开放供应链协同 SCC 的供应商信息管理原型，其他演示入口已预留。</p>
    <div class="cards">
      <a class="card live" href="{{BASE}}scc/"><span class="code">SCC / 供应链协同</span><h2>供应商信息管理</h2><p>体验年度资料更新、资质证照、主子账号与采购审核流程。</p><span class="action">进入演示 →</span></a>
      <a class="card planned" href="{{BASE}}psi/"><span class="code">PSI / 进销存管理</span><h2>采购 · 销售 · 库存</h2><p>进销存前端演示将在后续建设。</p><span class="action">查看预留入口 →</span></a>
      <a class="card planned" href="{{BASE}}pay/"><span class="code">PAY / 支付服务</span><h2>统一支付服务</h2><p>支付服务前端演示将在后续建设。</p><span class="action">查看预留入口 →</span></a>
    </div>
  </main>
  <footer>版权所有 © 浙江同力信息科技有限公司 · 演示数据均为虚构内容</footer>
</div></body>
</html>
